<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>レポスル労務｜近日公開</title>
<meta name="description" content="レポスル労務は近日公開です。レポスル日報と同じアプリの中で使えるようにする予定です。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b1b18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1b18;--paper:#f4f3ee;--yellow:#f7dc7c;--green:#2f7a52}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px 16px;font-family:"Noto Sans JP",sans-serif;color:var(--ink);
  background:var(--paper) radial-gradient(circle,rgba(27,27,24,.16) 1.4px,transparent 1.6px) 0 0/11px 11px}
.logo img{height:56px;width:auto;display:block;mix-blend-mode:multiply}
.koma{position:relative;width:min(640px,100%);background:#fff;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:44px 28px 32px;text-align:center}
.soon{position:absolute;top:-22px;right:-10px;transform:rotate(6deg);background:var(--yellow);border:3px solid var(--ink);padding:4px 14px;font-weight:900;font-size:20px}
h1{margin:0;font-size:clamp(26px,6vw,40px);font-weight:900;line-height:1.3}
p{margin:16px 0 0;font-weight:700;line-height:1.8;color:#44443f}
.cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 22px;border:3px solid var(--ink);font-weight:900;text-decoration:none;color:var(--ink);background:#fff}
.btn.fill{background:var(--green);color:#fff}
@media (max-width:480px){.cta .btn{width:100%}}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-16769513601"></script>

<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="favicon.png" sizes="512x512">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<a class="logo" href="./" aria-label="シン・レポスル"><img src="lp1/img/logo.webp" alt="シン・レポスル" width="260" height="113"></a>
<main class="koma">
  <div class="soon">近日公開！</div>
  <h1>レポスル労務</h1>
  <p>ただいま準備中です。<br>レポスル日報と同じアプリの中で、<br>使えるようにする予定です。</p>
  <p>公開のご案内をご希望の方は、<br>お問い合わせください。</p>
  <div class="cta"><a class="btn fill" href="https://app.reposul.com/demo/contact?type=inquiry" target="_blank" rel="noopener">お問い合わせ</a><a class="btn" href="./">レポスル日報を見る</a></div>
</main>
</body>
</html>
